name: EuroSys AE 1-5 on SPARK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_libraries:
        description: Run group 1 library correctness
        required: true
        default: true
        type: boolean
      run_cli:
        description: Run group 2 command-line benchmarks
        required: true
        default: true
        type: boolean
      run_breakdown:
        description: Run group 3 breakdowns and coverage
        required: true
        default: true
        type: boolean
      run_games:
        description: Run group 4 initial-scene game FPS
        required: true
        default: true
        type: boolean
      run_modifications:
        description: Run group 5 modification analysis
        required: true
        default: true
        type: boolean
      repetitions:
        description: Repetitions for each command-line benchmark lane
        required: true
        default: "5"
      rounds:
        description: Rounds for each breakdown measurement
        required: true
        default: "5"
      run_seconds:
        description: Seconds to keep each game lane in its initial scene
        required: true
        default: "30"
      cpu:
        description: Logical CPU used by pinned breakdown measurements
        required: true
        default: "0"

permissions:
  contents: read

concurrency:
  group: spark-eurosys-ae
  cancel-in-progress: false

jobs:
  evaluation:
    name: Complete evaluation groups 1 through 5
    runs-on: [self-hosted, linux, ARM64, spark-gpu]
    timeout-minutes: 1440
    env:
      RUN_LIBRARIES: ${{ github.event_name == 'push' || inputs.run_libraries }}
      RUN_CLI: ${{ github.event_name == 'push' || inputs.run_cli }}
      RUN_BREAKDOWN: ${{ github.event_name == 'push' || inputs.run_breakdown }}
      RUN_GAMES: ${{ github.event_name == 'push' || inputs.run_games }}
      RUN_MODIFICATIONS: ${{ github.event_name == 'push' || inputs.run_modifications }}
      CI_GAME_SECONDS: ${{ inputs.run_seconds || '30' }}
      REPETITIONS: ${{ inputs.repetitions || '5' }}
      ROUNDS: ${{ inputs.rounds || '5' }}
      CPU: ${{ inputs.cpu || '0' }}
      VCPKG_BINARY_SOURCES: clear;files,/home/user/eurosys-lorelei-artifacts/.cache/vcpkg-binary,readwrite

    steps:
      - name: Report the SPARK host configuration
        shell: bash
        run: |
          set -uo pipefail

          echo "::group::Runner identity"
          printf 'timestamp_utc=%s\n' "$(date -u +%FT%TZ)"
          printf 'runner_name=%s\n' "${RUNNER_NAME:-unknown}"
          printf 'runner_os=%s\n' "${RUNNER_OS:-unknown}"
          printf 'runner_arch=%s\n' "${RUNNER_ARCH:-unknown}"
          printf 'user=%s\n' "$(id -un)"
          id
          printf 'hostname=%s\n' "$(hostname)"
          printf 'virtualization=%s\n' "$(systemd-detect-virt 2>/dev/null || echo none)"
          uname -a
          echo "::endgroup::"

          echo "::group::Operating system and kernel"
          cat /etc/os-release
          printf '\nKernel command line:\n'
          cat /proc/cmdline
          printf '\nLoaded kernel modules:\n'
          lsmod || true
          echo "::endgroup::"

          echo "::group::CPU and NUMA"
          lscpu
          printf '\nOnline CPUs: '
          cat /sys/devices/system/cpu/online
          printf 'CPU governor: '
          cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || echo unavailable
          if command -v numactl >/dev/null; then
              numactl --hardware
          fi
          echo "::endgroup::"

          echo "::group::Memory"
          free -h
          printf '\nSelected memory details:\n'
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree|HugePages_Total|Hugepagesize):' /proc/meminfo
          echo "::endgroup::"

          echo "::group::Storage"
          lsblk -e 7 -o NAME,TYPE,SIZE,FSTYPE,MOUNTPOINTS,MODEL,ROTA
          printf '\nMounted filesystem capacity:\n'
          df -hT
          echo "::endgroup::"

          echo "::group::PCIe and graphics hardware"
          if command -v lspci >/dev/null; then
              lspci -nnk
          fi
          printf '\nDRM devices:\n'
          ls -la /dev/dri 2>/dev/null || true
          for property in vendor product_name product_version board_name; do
              path="/sys/devices/virtual/dmi/id/$property"
              if [[ -r $path ]]; then
                  printf '%s=' "$property"
                  cat "$path"
              fi
          done
          echo "::endgroup::"

          echo "::group::NVIDIA GPU and driver"
          if command -v nvidia-smi >/dev/null; then
              nvidia-smi --query-gpu=name,driver_version,pci.bus_id,memory.total,power.limit,clocks.max.graphics,clocks.max.memory \
                  --format=csv
              printf '\nGPU topology:\n'
              nvidia-smi topo --matrix || true
          else
              echo "nvidia-smi is unavailable"
          fi
          echo "::endgroup::"

          echo "::group::Display and graphics APIs"
          printf 'DISPLAY=%s\n' "${DISPLAY:-unset}"
          printf 'XAUTHORITY=%s\n' "${XAUTHORITY:-unset}"
          if command -v xdpyinfo >/dev/null && [[ -n ${DISPLAY:-} ]]; then
              env DISPLAY="$DISPLAY" XAUTHORITY="${XAUTHORITY:-}" xdpyinfo | sed -n '1,35p' || true
          fi
          if command -v glxinfo >/dev/null && [[ -n ${DISPLAY:-} ]]; then
              env DISPLAY="$DISPLAY" XAUTHORITY="${XAUTHORITY:-}" glxinfo -B || true
          fi
          echo "::endgroup::"

          echo "::group::Docker engine"
          docker version || true
          docker info --format 'Server={{.ServerVersion}} OS={{.OperatingSystem}} Kernel={{.KernelVersion}} Architecture={{.Architecture}} CPUs={{.NCPU}} Memory={{.MemTotal}} StorageDriver={{.Driver}} CgroupDriver={{.CgroupDriver}}' || true
          echo "::endgroup::"

      - name: Check out the artifact repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Stop stale AE CI containers
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t stale_containers < <(
              docker ps --all --format '{{.Names}}' |
                  grep -E '^lorelei-ae-[0-9]+-[0-9]+$' || true
          )
          for container in "${stale_containers[@]}"; do
              echo "Removing stale CI container: $container"
              docker rm --force "$container"
          done

      - name: Start an evidence-isolated CI batch
        shell: bash
        run: ./evaluations/archive-ci-results.sh

      - name: Check the Ubuntu 24.04 ARM64 GPU host
        id: host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          grep -qx 'ID=ubuntu' /etc/os-release
          grep -qx 'VERSION_ID="24.04"' /etc/os-release
          for command in docker mangohud glxinfo xdpyinfo xauth xdotool cmake python3; do
              command -v "$command" >/dev/null || {
                  echo "Missing host command: $command" >&2
                  exit 1
              }
          done
          test -n "${DISPLAY:-}" || {
              echo "DISPLAY is missing from the self-hosted runner environment" >&2
              exit 1
          }
          test -n "${XAUTHORITY:-}" && test -r "$XAUTHORITY" || {
              echo "XAUTHORITY is missing or unreadable: ${XAUTHORITY:-unset}" >&2
              exit 1
          }
          env DISPLAY="$DISPLAY" XAUTHORITY="$XAUTHORITY" xdpyinfo >/dev/null
          env DISPLAY="$DISPLAY" XAUTHORITY="$XAUTHORITY" glxinfo -B
          renderer=$(env DISPLAY="$DISPLAY" XAUTHORITY="$XAUTHORITY" glxinfo -B |
              sed -n 's/^[[:space:]]*OpenGL renderer string:[[:space:]]*//p' | head -1)
          if [[ -z $renderer || $renderer =~ [Ll][Ll][Vv][Mm][Pp][Ii][Pp][Ee] ||
                $renderer =~ [Ss][Oo][Ff][Tt][Pp][Ii][Pp][Ee] ||
                $renderer =~ [Ss][Ww][Rr][Aa][Ss][Tt] ]]; then
              echo "The self-hosted runner is not using a physical OpenGL renderer: ${renderer:-unknown}" >&2
              exit 1
          fi
          docker info >/dev/null

      - name: Build and start the AE container
        id: container
        shell: bash
        run: |
          set -euo pipefail
          image=lorelei-eurosys27-ae:github-actions
          container=lorelei-ae-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          cleanup() {
              docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          proxy_build_args=()
          proxy_run_args=()
          for name in http_proxy https_proxy no_proxy HTTP_PROXY HTTPS_PROXY NO_PROXY; do
              if [[ -n ${!name:-} ]]; then
                  proxy_build_args+=(--build-arg "$name=${!name}")
                  proxy_run_args+=(--env "$name=${!name}")
              fi
          done
          docker rm --force "$container" >/dev/null 2>&1 || true
          docker build \
              --build-arg USE_USTC_MIRROR=1 \
              --build-arg "USER_UID=$(id -u)" \
              --build-arg "USER_GID=$(id -g)" \
              "${proxy_build_args[@]}" \
              --tag "$image" \
              --file docker/Dockerfile .
          docker run --detach \
              --name "$container" \
              --network host \
              "${proxy_run_args[@]}" \
              --env "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES" \
              --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/home/user/eurosys-lorelei-artifacts" \
              "$image" sleep infinity
          echo "AE_CONTAINER=$container" >>"$GITHUB_ENV"
          trap - EXIT

      - name: Bootstrap the pinned vcpkg release
        id: vcpkg
        if: env.RUN_LIBRARIES == 'true' || env.RUN_CLI == 'true' || env.RUN_BREAKDOWN == 'true' || env.RUN_GAMES == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker exec \
              --workdir /home/user/eurosys-lorelei-artifacts \
              "$AE_CONTAINER" bash -lc '
                  set -euo pipefail
                  if [[ ! -x vcpkg/bootstrap-vcpkg.sh ]]; then
                      git clone https://github.com/microsoft/vcpkg.git vcpkg
                  fi
                  git -C vcpkg fetch --tags --force
                  git -C vcpkg checkout --force 2026.07.29
                  if [[ ! -x vcpkg/vcpkg ]]; then
                      ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
                  fi
                  mkdir -p .cache/vcpkg-binary
              '

      - name: Install the Lorelei devkit
        id: install_devkit
        if: env.RUN_LIBRARIES == 'true' || env.RUN_CLI == 'true' || env.RUN_BREAKDOWN == 'true' || env.RUN_GAMES == 'true'
        shell: bash
        run: |
          docker exec \
              --workdir /home/user/eurosys-lorelei-artifacts \
              "$AE_CONTAINER" ./evaluations/install-devkit.sh

      - name: Install evaluation tools
        id: install_tools
        if: env.RUN_LIBRARIES == 'true' || env.RUN_CLI == 'true' || env.RUN_BREAKDOWN == 'true' || env.RUN_GAMES == 'true'
        shell: bash
        run: |
          docker exec \
              --workdir /home/user/eurosys-lorelei-artifacts \
              "$AE_CONTAINER" ./evaluations/install-tools.sh --plain

      - name: Install library packages
        id: install_libraries
        if: env.RUN_LIBRARIES == 'true' || env.RUN_CLI == 'true' || env.RUN_BREAKDOWN == 'true' || env.RUN_GAMES == 'true'
        shell: bash
        run: |
          docker exec \
              --workdir /home/user/eurosys-lorelei-artifacts \
              "$AE_CONTAINER" ./evaluations/install-libs.sh --plain

      - name: Install game packages
        id: install_games
        if: env.RUN_GAMES == 'true' && steps.install_libraries.outcome == 'success'
        shell: bash
        run: |
          docker exec \
              --workdir /home/user/eurosys-lorelei-artifacts \
              "$AE_CONTAINER" ./evaluations/install-games.sh --plain

      - name: Run group 1 library correctness
        id: libraries
        if: env.RUN_LIBRARIES == 'true' && steps.install_libraries.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          docker exec \
              --workdir /home/user/eurosys-lorelei-artifacts \
              "$AE_CONTAINER" \
              ./evaluations/1-libs/run-all.sh --restart --verbose --plain

      - name: Run group 2 command-line benchmarks
        id: cli
        if: env.RUN_CLI == 'true' && steps.install_libraries.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          docker exec \
              --env "REPETITIONS=$REPETITIONS" \
              --workdir /home/user/eurosys-lorelei-artifacts \
              "$AE_CONTAINER" \
              ./evaluations/2-cli-benchmarks/run-all.sh --restart --plain

      - name: Run group 3 breakdowns and coverage
        id: breakdown
        if: env.RUN_BREAKDOWN == 'true' && steps.install_libraries.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          run_in_container() {
              docker exec \
                  --env "ROUNDS=$ROUNDS" \
                  --env "CPU=$CPU" \
                  --workdir /home/user/eurosys-lorelei-artifacts \
                  "$AE_CONTAINER" "$@" || failed=1
          }
          run_in_container ./evaluations/3-breakdown/box64-callback-track/run.sh
          run_in_container ./evaluations/3-breakdown/hecate-callback-track/run.sh
          run_in_container ./evaluations/3-breakdown/breakdown-test/run.sh
          run_in_container python3 evaluations/3-breakdown/coverage-effort/run.py
          exit "$failed"

      - name: Run group 4 initial-scene game FPS
        id: games
        if: env.RUN_GAMES == 'true' && steps.install_games.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          ./evaluations/4-games/run-ci.sh "$CI_GAME_SECONDS"

      - name: Run group 5 modification analysis
        id: modifications
        if: env.RUN_MODIFICATIONS == 'true' && steps.container.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          docker exec \
              --workdir /home/user/eurosys-lorelei-artifacts \
              "$AE_CONTAINER" ./evaluations/5-modifications/run.sh

      - name: Export available paper data
        id: export
        if: always() && steps.container.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          docker exec \
              --workdir /home/user/eurosys-lorelei-artifacts \
              "$AE_CONTAINER" python3 evaluations/export-paper-data.py

      - name: Stop the AE container
        if: always() && steps.container.outcome == 'success'
        shell: bash
        run: docker rm --force "$AE_CONTAINER" || true

      - name: Write evaluation results to the workflow summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          report_group() {
              local number=$1 name=$2 enabled=$3 outcome=$4
              local status=skipped
              if [[ $enabled == true ]]; then
                  status=$outcome
                  [[ $outcome != skipped ]] || status=blocked
              fi
              printf '| %s | %s | %s |\n' "$number" "$name" "$status" \
                  >>"$GITHUB_STEP_SUMMARY"
          }

          {
              echo '## Evaluation group status'
              echo
              echo '| Group | Evaluation | Status |'
              echo '| --- | --- | --- |'
          } >>"$GITHUB_STEP_SUMMARY"
          report_group 1 libraries "$RUN_LIBRARIES" "${{ steps.libraries.outcome }}"
          report_group 2 cli "$RUN_CLI" "${{ steps.cli.outcome }}"
          report_group 3 breakdown "$RUN_BREAKDOWN" "${{ steps.breakdown.outcome }}"
          report_group 4 games "$RUN_GAMES" "${{ steps.games.outcome }}"
          report_group 5 modifications "$RUN_MODIFICATIONS" "${{ steps.modifications.outcome }}"

          if [[ $RUN_LIBRARIES == true ]]; then
              python3 evaluations/1-libs/_common/library-summary-markdown.py \
                  --repo-root "$GITHUB_WORKSPACE" \
                  --batch-summary .work/evaluations/1-libs-batch/verified/summary.tsv \
                  >>"$GITHUB_STEP_SUMMARY"
          fi

          shopt -s nullglob
          files=(evaluations/paper-data/*.csv)
          if ((${#files[@]} == 0)); then
              echo "No paper CSV data was produced." >>"$GITHUB_STEP_SUMMARY"
          else
              for csv in "${files[@]}"; do
                  python3 evaluations/4-games/_common/csv-to-markdown.py "$csv" \
                      >>"$GITHUB_STEP_SUMMARY"
              done
          fi

      - name: Upload all exported paper data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-data-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            evaluations/paper-data/*.csv
            evaluations/paper-data/manifest.json

      - name: Upload raw evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            evaluations/1-libs/*/results/**
            evaluations/2-cli-benchmarks/*/results/**
            !evaluations/2-cli-benchmarks/*/results/**/outputs/**
            evaluations/3-breakdown/*/results/**
            evaluations/4-games/*/results/**
            evaluations/5-modifications/results/**

      - name: Enforce every evaluation group
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          check_required() {
              local name=$1 outcome=$2
              echo "$name=$outcome"
              [[ $outcome == success ]] || failed=1
          }

          check_group() {
              local name=$1 enabled=$2 outcome=$3
              local status=skipped
              if [[ $enabled == true ]]; then
                  status=$outcome
                  [[ $outcome != skipped ]] || status=blocked
                  [[ $outcome == success ]] || failed=1
              fi
              printf '%s=%s\n' "$name" "$status"
          }

          check_required host "${{ steps.host.outcome }}"
          check_required container "${{ steps.container.outcome }}"
          if [[ "${{ env.RUN_LIBRARIES == 'true' || env.RUN_CLI == 'true' || env.RUN_BREAKDOWN == 'true' || env.RUN_GAMES == 'true' }}" == true ]]; then
              check_required vcpkg "${{ steps.vcpkg.outcome }}"
              check_required install-devkit "${{ steps.install_devkit.outcome }}"
              check_required install-tools "${{ steps.install_tools.outcome }}"
              check_required install-libraries "${{ steps.install_libraries.outcome }}"
          fi
          if [[ "$RUN_GAMES" == true ]]; then
              check_required install-games "${{ steps.install_games.outcome }}"
          fi
          check_required export "${{ steps.export.outcome }}"

          check_group libraries "$RUN_LIBRARIES" "${{ steps.libraries.outcome }}"
          check_group cli "$RUN_CLI" "${{ steps.cli.outcome }}"
          check_group breakdown "$RUN_BREAKDOWN" "${{ steps.breakdown.outcome }}"
          check_group games "$RUN_GAMES" "${{ steps.games.outcome }}"
          check_group modifications "$RUN_MODIFICATIONS" "${{ steps.modifications.outcome }}"
          exit "$failed"
